# ============================================================
# Career.zip Frontend 운영 nginx (기존 nginx.conf 하드닝 버전)
# 기존 대비 추가: gzip, 보안 헤더, 정적자산 캐시/ index.html no-cache,
#   /healthz, /api 프록시 타임아웃(LLM/STT 장시간 대응), 실제 클라이언트 IP 전달.
# careerdotzip.site의 HTTP→HTTPS 전환과 기존 Let's Encrypt 인증서 경로를 포함한다.
# 인증서 파일 자체는 이미지에 넣지 않고 EC2의 /etc/letsencrypt를 read-only로 마운트한다.
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name careerdotzip.site;

    # Docker/Actions health check remains available over loopback HTTP.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # All user traffic is encrypted. Compose mounts the existing EC2
    # /etc/letsencrypt directory read-only into this container.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name careerdotzip.site;

    ssl_certificate /etc/letsencrypt/live/careerdotzip.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerdotzip.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;          # 업로드 10MB 정책과 정합

    # gzip (정적 텍스트 자산 압축)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # 보안 헤더 (HSTS 는 HTTPS 확정 후 ALB/nginx 에서 적용 — 여기선 미설정)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # nginx 자체 헬스(프론트 컨테이너 healthcheck / ALB 용)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 해시 파일명 정적 자산: 장기 캐시(immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 라우트 새로고침 404 방지. index.html 은 캐시 금지(배포 즉시 반영)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # API 리버스 프록시 -> 백엔드 gunicorn
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM/STT 등 장시간 요청 대응 (기본 60s 로는 끊김)
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }
}
