name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 대상 (GitHub Environment 이름과 일치해야 함)"
        type: choice
        required: true
        default: production
        options:
          - development
          - production

concurrency:
  group: frontend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment 를 지정하면 동일 이름의 GitHub Environment 에 등록된 Secret 이
    # 레포 레벨 Secret 보다 우선 적용된다(없으면 레포 레벨로 폴백).
    environment: ${{ inputs.environment }}
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/CAREER_DOT_ZIP
            git pull
            git submodule update --remote CAREER_DOT_ZIP_FRONTEND
            docker compose -f docker-compose.prod.yml up --build -d frontend
            # 헬스 확인(10회 재시도 후에도 실패하면 비정상 종료 -> 배포 실패로 표시)
            for i in $(seq 1 10); do
              curl -fsS http://localhost/ >/dev/null && break
              sleep 5
            done
            curl -fsS http://localhost/ >/dev/null

# 필요한 GitHub Secrets — Environment 레벨(development / production 각각 별도 값):
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
# ※ Settings → Environments 에서 development/production 을 만들고 그 안에 위 3개를 등록.
#    (backend repo의 deploy.yml과 시크릿 이름을 통일했습니다 — EC2_KEY가 아니라 EC2_SSH_KEY)
# 실행: Actions 탭에서 Deploy Frontend 워크플로 실행 시 environment 입력값으로 development/production 선택.
